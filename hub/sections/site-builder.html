<div id="sb-root" class="sb-root">
  <header class="sb-topbar">
    <div class="sb-topbar__left">
      <button type="button" id="sb-back" class="sb-icon-btn" title="Voltar ao Hub">
        <span class="material-symbols-outlined" aria-hidden="true">arrow_back</span>
      </button>
      <span class="sb-topbar__logo material-symbols-outlined" aria-hidden="true">language</span>
      <span class="sb-topbar__title">Editor do Site</span>
    </div>
    <p id="sb-save-status" class="sb-topbar__status">Pronto</p>
    <div class="sb-topbar__actions">
      <button type="button" id="sb-refresh-preview" class="sb-icon-btn" title="Atualizar preview">
        <span class="material-symbols-outlined" aria-hidden="true">refresh</span>
      </button>
      <button type="button" id="sb-preview" class="sb-icon-btn" title="Abrir preview">
        <span class="material-symbols-outlined" aria-hidden="true">open_in_new</span>
      </button>
      <button type="button" id="sb-publish" class="sb-publish-btn">Publicar site</button>
    </div>
  </header>

  <div class="sb-workspace sb-workspace--site">
    <aside class="sb-pages-sidebar" aria-label="Páginas do site">
      <p class="sb-pages-sidebar__label">Site</p>
      <ul id="sb-pages-list" class="sb-pages-sidebar__list"></ul>
      <p class="sb-pages-sidebar__label">Páginas extras</p>
      <ul id="sb-custom-pages-list" class="sb-pages-sidebar__list"></ul>
      <button type="button" id="sb-new-custom-page" class="sb-mini-btn sb-pages-sidebar__new">+ Página extra</button>
    </aside>

    <div class="sb-preview-wrap">
      <iframe id="sb-preview-frame" class="sb-preview-frame" title="Preview do site" src="about:blank"></iframe>
    </div>

    <aside class="sb-panel sb-panel--editor" aria-label="Propriedades">
      <div class="sb-panel__head">
        <h2 id="sb-editor-title">Propriedades</h2>
      </div>
      <div id="sb-editor-form" class="sb-panel__body sb-editor-form"></div>
    </aside>
  </div>
</div>

<div id="sb-custom-editor" class="sb-custom-editor hidden">
  <div id="sb-custom-root"></div>
</div>
